[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvc-dlif"
version = "0.1.0"
description = "Partial volume correction for deep-learning-derived input functions in preclinical PET"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tor-Ivar Hassfjord" }]
keywords = ["PET", "partial volume correction", "deconvolution", "input function", "preclinical"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "nibabel>=5.0",
    "pydicom>=2.4",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed for the DLIF stages (inference and retraining).
torch = ["torch>=2.0"]
# Parquet result tables; without it the pipeline falls back to CSV.
io = ["pyarrow>=14.0"]
# Sub-voxel registration in the motion-correction fallback.
motion = ["scikit-image>=0.22"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["torch>=2.0", "pyarrow>=14.0", "scikit-image>=0.22", "pytest>=7.4"]

[project.urls]
Repository = "https://github.com/tihassfjord/pvc-dlif"

[project.scripts]
# `pvc-dlif-gui` from any terminal once the package is installed.
pvc-dlif-gui = "pvc_dlif_gui.app:main"

[tool.setuptools.packages.find]
# The library lives in src/, the GUI in gui/ - both are importable packages.
where = ["src", "gui"]
include = ["pvc_dlif*", "pvc_dlif_gui*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
