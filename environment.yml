# Conda environment for pvc-dlif.
#
# PETPVC is the reason this is a conda environment rather than a plain
# requirements.txt: it is a compiled toolbox distributed through conda-forge
# and is not installable from PyPI.
#
#   conda env create -f environment.yml
#   conda activate pvc-dlif
#   pip install -e ".[all]"
name: pvc-dlif
channels:
  - conda-forge
dependencies:
  - python=3.11
  - petpvc            # the partial volume correction toolbox
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - pyyaml>=6.0
  - nibabel>=5.0
  - pydicom>=2.4
  - scikit-learn>=1.3
  - scikit-image>=0.22
  - pyarrow>=14.0
  - pytest>=7.4
  - pip
  - pip:
      # Install the matching CUDA build yourself if you have a GPU; the
      # retraining stage is impractical on CPU.
      - torch>=2.0
